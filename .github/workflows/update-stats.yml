name: Update GitHub signal

on:
  schedule:
    - cron: "17 6 * * *" # daily, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # GH_STATS_TOKEN must be a classic PAT with read:user (and repo if you
      # want private contribution counts). The default GITHUB_TOKEN only sees
      # public activity, so without the secret we skip rather than publish
      # lower numbers.
      - name: Regenerate signal.svg
        env:
          GH_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::GH_STATS_TOKEN secret not set, skipping refresh"
            exit 0
          fi
          node scripts/update-stats.mjs

      - name: Commit if changed
        run: |
          if git diff --quiet; then
            echo "no changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/signal.svg README.md
          git commit -m "chore: refresh github signal"
          git push
