<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="998" viewBox="0 0 1000 998" role="img" aria-labelledby="title desc" xml:space="preserve">
  <title id="title">ai / llm engineering</title>
  <desc id="desc">llm engineering: anthropic sdk, openai sdk, gemini api, vercel ai sdk, streaming (sse), tool calling, structured outputs (json schema, zod), prompt caching, batch api, extended thinking, vision / multimodal, long-context strategies, token budgeting, model routing + fallbacks, retries / rate limits, cost &amp; latency tuning. agents: react / plan-execute loops, langgraph, mcp servers + clients, multi-agent orchestration, tool design + sandboxing, agent memory (episodic, vector), human-in-the-loop, computer use, browser agents (playwright), coding agents (claude code, codex), agent tracing + replay. retrieval: rag pipelines, chunking (semantic, recursive, layout-aware), embeddings (text-embedding-3, voyage, bge), pgvector, pinecone, qdrant, hybrid search (bm25 + vectors), reranking (cohere, cross-encoders), query rewriting / hyde, metadata filtering, citation grounding, graph rag. document ai: pdf parsing (pymupdf, pdfplumber, unstructured), ocr (tesseract, textract, azure di), layout + table extraction, excel / rent roll / t12 parsing, schema-driven extraction, confidence scoring, source-linked outputs, entity resolution + dedup. evals &amp; safety: golden sets + regression suites, promptfoo, braintrust, llm-as-judge, rubric grading, a/b prompt testing, input / output guardrails, pii redaction, prompt injection defense, red-teaming, observability (langfuse, helicone). models &amp; training: pytorch, hugging face transformers, lora / qlora (peft), distillation, quantization (gguf, int4/8), llama.cpp, vllm / ollama serving, core ml, whisper / faster-whisper, speech-to-text pipelines, embedding fine-tuning, sklearn / xgboost</desc>
  <rect width="1000" height="998" rx="14" fill="#09090b"/>
  <rect x=".5" y=".5" width="999" height="997" rx="13.5" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  <g font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
    <text x="48" y="52"><tspan fill="#52525b">z1ros ~ %</tspan><tspan fill="#e4e4e7"> skills --ai</tspan></text>
