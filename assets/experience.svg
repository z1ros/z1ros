<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="702" viewBox="0 0 1000 702" role="img" aria-labelledby="title desc" xml:space="preserve">
  <title id="title">experience</title>
  <desc id="desc">2026 → now: cto at husky · aximon.ai, underwriting ai for cre teams · $60k contracted in 5 weeks · backed by an a16z scout. 2026: founder in residence at antler s26, san francisco · ~2% acceptance · pivoted protege → husky. 2026: ceo at protege, ai coding mentor that lives in your editor · 1.6k downloads · sh1p s26. 2026: design engineer at runanywhere · yc w26, on-device ai infrastructure · shipped pitchperfect on their sdk. 2026: cto at nymble, early-stage build. 2025: cto at stealth startup · brno, 2,000 hours · walked away when the bar stopped rising. 2025: software engineer at feedyou, solo-shipped a $22k ai support agent · #1 microsoft ai 2019. 2025: design engineer at cuub, largest power-bank rental network in illinois · raised $270k+. 2025: design engineer at highlight · nyc, disney, airbnb, american express, johnson &amp; johnson, deloitte. 2022 → 2024: design engineer at udox, 2 years · where it started</desc>
