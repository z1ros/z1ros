<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Yurii Tovarnytskyi — founder, engineer, designer</title>
  <desc id="desc">Terminal-inspired profile banner showing Yurii's current mission: building Husky for commercial real estate.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090a"/>
      <stop offset="0.62" stop-color="#0d0e12"/>
      <stop offset="1" stop-color="#151020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="35%" r="55%">
      <stop offset="0" stop-color="#7c3aed" stop-opacity=".24"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glow)"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".10"/>

  <circle cx="34" cy="30" r="5" fill="#ff5f57"/>
  <circle cx="53" cy="30" r="5" fill="#febc2e"/>
  <circle cx="72" cy="30" r="5" fill="#28c840"/>
  <text x="99" y="35" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">z1ros@github: ~/build</text>
  <line x1="24" y1="56" x2="1176" y2="56" stroke="#ffffff" stroke-opacity=".08"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <text x="58" y="122" fill="#a78bfa" font-size="15" letter-spacing="2">HELLO, I'M</text>
    <text x="55" y="174" fill="#f7f8f8" font-size="43" font-weight="700" letter-spacing="-1.5">YURII TOVARNYTSKYI</text>
    <rect x="58" y="192" width="496" height="3" rx="1.5" fill="url(#accent)"/>
    <text x="58" y="228" fill="#a1a1aa" font-size="17">founder  /  engineer  /  designer</text>

    <text x="58" y="274" fill="#22d3ee" font-size="14">$</text>
    <text x="78" y="274" fill="#d4d4d8" font-size="14">building products where code meets real-world leverage</text>
    <text x="58" y="303" fill="#22d3ee" font-size="14">$</text>
    <text x="78" y="303" fill="#71717a" font-size="14">ukraine → prague → chicago → san francisco</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="790" y="88" width="344" height="214" rx="14" fill="#101116" stroke="#ffffff" stroke-opacity=".10"/>
    <rect x="810" y="109" width="7" height="7" rx="3.5" fill="#34d399"/>
    <text x="828" y="117" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.2">CURRENT MISSION</text>
    <text x="811" y="171" fill="#f7f8f8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="35" font-weight="700">HUSKY</text>
    <text x="811" y="199" fill="#a1a1aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">AI infrastructure for CRE decisions</text>
    <line x1="811" y1="221" x2="1113" y2="221" stroke="#ffffff" stroke-opacity=".08"/>

    <rect x="811" y="241" width="90" height="32" rx="5" fill="#7c3aed" fill-opacity=".18" stroke="#8b5cf6" stroke-opacity=".45"/>
    <text x="856" y="262" text-anchor="middle" fill="#c4b5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">ANTLER S26</text>
    <rect x="911" y="241" width="93" height="32" rx="5" fill="#2563eb" fill-opacity=".16" stroke="#3b82f6" stroke-opacity=".40"/>
    <text x="957.5" y="262" text-anchor="middle" fill="#93c5fd" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">EX-YC ENG</text>
    <rect x="1014" y="241" width="99" height="32" rx="5" fill="#059669" fill-opacity=".15" stroke="#10b981" stroke-opacity=".40"/>
    <text x="1063.5" y="262" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11">4X JUDGE</text>
  </g>
</svg>
