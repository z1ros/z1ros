  <title id="title">skills</title>
  <desc id="desc">languages: typescript, javascript, python, sql, swift, bash, html / css. frontend: next.js app router, react, react native / expo, tailwind, shadcn/ui, radix, framer motion, zustand, tanstack query, react hook form, zod, three.js, vite. backend: node, bun, hono, express, fastapi, trpc, prisma, drizzle, supabase, postgres, pgvector, redis, graphql, websockets, edge functions, queues / cron. infra: aws (s3, lambda, ec2), vercel, cloudflare workers, docker, github actions, stripe, sentry, posthog, resend, playwright. data: pandas, numpy, jupyter, openpyxl / excel automation, pdfplumber, scraping (playwright, puppeteer), sql analytics. design: product design, design systems, figma, brand identity, motion, prototyping, ux research, figma → code. founder: 0 → 1, gtm, discovery calls, pitching, hiring, fundraising, short-form content</desc>
