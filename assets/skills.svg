  <title id="title">skills</title>
  <desc id="desc">languages: typescript, javascript, python, sql, swift, bash. frontend: next.js, react, react native, tailwind, shadcn/ui, framer motion, three.js. backend: node, supabase, postgres, pgvector, redis, graphql, rest, websockets, edge functions. infra: aws, vercel, docker, github actions, cloudflare, stripe, sentry, posthog. ai / ml: llm apps, rag, agents, tool use, mcp, claude api, openai api, prompt engineering, evals, structured extraction, document ai, ocr, embeddings, vector search, fine-tuning, whisper, speech-to-text, on-device inference, pytorch, hugging face, langchain, multi-agent systems, eval harnesses, guardrails, cost / latency tuning. design: product design, design systems, figma, brand, motion, prototyping, ux research. founder: 0 → 1, gtm, sales calls, pitching, hiring, fundraising, short-form content</desc>
