  <title id="title">stack</title>
  <desc id="desc">ai: multi-agent systems, voice ai, mcp, rag, evals, ai dev tools. computer vision: depth anything v2, segmentation, 3d face mesh, hand + pose tracking, optical flow. deep learning: vgg19 style transfer, backprop by hand, yolo fine-tuning, on-device inference. frontend · design: next.js, react, figma, photoshop, illustrator. backend · systems: custom xlsx engine, opentelemetry, imessage bots, headless crawlers, glsl shaders</desc>
