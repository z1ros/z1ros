<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="224" viewBox="0 0 1200 224" role="img" aria-labelledby="title desc">
  <title id="title">Yurii's GitHub signal</title>
  <desc id="desc">July 2026 snapshot: 2,048 total contributions, 453 public commits, 863 contributions in the last year, and a 16 day longest streak.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#11121a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed"/>
      <stop offset="0.5" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#fff" stroke-opacity=".025"/>
    </pattern>
  </defs>

  <rect width="1200" height="224" rx="16" fill="url(#bg)"/>
  <rect width="1200" height="224" rx="16" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="222" rx="15" fill="none" stroke="#ffffff" stroke-opacity=".10"/>
  <rect x="24" y="21" width="5" height="5" rx="2.5" fill="#34d399"/>
  <text x="41" y="29" fill="#71717a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.1">GITHUB SIGNAL · SNAPSHOT JUL 2026</text>
  <line x1="24" y1="48" x2="1176" y2="48" stroke="#ffffff" stroke-opacity=".08"/>
  <rect x="24" y="48" width="1152" height="2" fill="url(#line)" opacity=".75"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
    <g transform="translate(55 78)">
      <text x="0" y="42" fill="#a78bfa" font-size="34" font-weight="700">2,048</text>
      <text x="0" y="70" fill="#f4f4f5" font-size="13">TOTAL CONTRIBUTIONS</text>
      <text x="0" y="94" fill="#71717a" font-size="11">since May 2022</text>
    </g>

    <line x1="300" y1="77" x2="300" y2="190" stroke="#ffffff" stroke-opacity=".08"/>
    <g transform="translate(340 78)">
      <text x="0" y="42" fill="#60a5fa" font-size="34" font-weight="700">453</text>
      <text x="0" y="70" fill="#f4f4f5" font-size="13">PUBLIC COMMITS</text>
      <text x="0" y="94" fill="#71717a" font-size="11">across public work</text>
    </g>

    <line x1="590" y1="77" x2="590" y2="190" stroke="#ffffff" stroke-opacity=".08"/>
    <g transform="translate(630 78)">
      <text x="0" y="42" fill="#22d3ee" font-size="34" font-weight="700">863</text>
      <text x="0" y="70" fill="#f4f4f5" font-size="13">LAST 12 MONTHS</text>
      <text x="0" y="94" fill="#71717a" font-size="11">public + private activity</text>
    </g>

    <line x1="890" y1="77" x2="890" y2="190" stroke="#ffffff" stroke-opacity=".08"/>
    <g transform="translate(930 78)">
      <text x="0" y="42" fill="#34d399" font-size="34" font-weight="700">16 DAYS</text>
      <text x="0" y="70" fill="#f4f4f5" font-size="13">LONGEST STREAK</text>
      <text x="0" y="94" fill="#71717a" font-size="11">Jan 05 → Jan 20, 2025</text>
    </g>
  </g>
</svg>
